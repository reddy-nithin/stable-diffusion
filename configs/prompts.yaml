# ── Naive template ────────────────────────────────────────────────────────────
naive: "a {breed} {condition}"

# ── Structured template ───────────────────────────────────────────────────────
# Condition and environment appear FIRST so CLIP's 77-token limit never cuts them.
# SD 1.5 parenthesis syntax (phrase:scale) boosts attention on that phrase.
structured: >-
  ({condition_clause}:1.35), ({environment_clause}:1.2),
  {style}, a {breed} {species}{breed_descriptor}, high detail

# ── Negative prompt ───────────────────────────────────────────────────────────
negative: >-
  cartoon, anime, blurry, lowres, deformed anatomy, extra limbs,
  watermark, text, logo, disturbing, graphic injury, blood, gore,
  human faces, nsfw, bad proportions, disfigured,
  frame, border, picture frame, bounding box, rectangle around subject,
  cropped, two animals, wrong breed, mutated, extra tail
