# ── Naive template ────────────────────────────────────────────────────────────
naive: "a {breed} {condition}"

# ── Structured template ───────────────────────────────────────────────────────
# Slots: {style}, {breed}, {species}, {breed_descriptor}, {condition_clause}, {environment_clause}
# breed_descriptor is injected as " with <traits>" when available, else empty string.
structured: >-
  {style}, a {breed} {species}{breed_descriptor}, {condition_clause},
  {environment_clause}, soft studio lighting, shallow depth of field,
  high detail, 50mm lens

# ── Negative prompt ───────────────────────────────────────────────────────────
negative: >-
  cartoon, anime, blurry, lowres, deformed anatomy, extra limbs,
  watermark, text, logo, disturbing, graphic injury, blood, gore,
  human faces, nsfw, bad proportions, disfigured
